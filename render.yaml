services:
  - type: web
    name: mexx-panel
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_URL
        value: https://mexx-panel.onrender.com
      # External MySQL required (Render has no managed MySQL).
      # Free options: Railway / Aiven / freemysqlhosting. Fill these in Render dashboard:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: PANEL_NAME
        value: "FEATURESTIC LEAKS"
      - key: PANEL_SUBTITLE
        value: "SDK LICENSE MANAGEMENT"
