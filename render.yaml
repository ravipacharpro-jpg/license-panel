services:
  - type: web
    name: kuro-panel
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    postDeploy: php -r "require 'conn.php'; kq('INSERT OR REPLACE INTO settings (key,value) VALUES (?,?)', ['owner_saldo','999999999']); kq('UPDATE users SET saldo=? WHERE level=?', [999999999,1]);"
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: APP_BASE_URL
        value: https://license-panel-b890.onrender.com/
      # Default DB is zero-config SQLite (auto-created in writable/).
      # For external MySQL instead, set:
      # - key: DB_DRIVER
      #   value: mysql
      # - key: DB_HOST
      #   sync: false
      # - key: DB_PORT
      #   value: "3306"
      # - key: DB_NAME
      #   sync: false
      # - key: DB_USER
      #   sync: false
      # - key: DB_PASS
      #   sync: false
